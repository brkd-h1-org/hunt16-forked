name: lowpriv-actor
on:
  workflow_dispatch:
    inputs:
      op:
        required: true
        default: comment
      target:
        required: true
      body:
        required: true
      head:
        required: false
        default: release
permissions:
  pull-requests: write
  issues: write
jobs:
  say:
    runs-on: ubuntu-latest
    steps:
      - name: act as github-actions[bot] with pull-requests:write only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OP: ${{ inputs.op }}
          TARGET: ${{ inputs.target }}
          BODY: ${{ inputs.body }}
          HEAD: ${{ inputs.head }}
        run: |
          printf '%s' "$BODY" > /tmp/b.txt
          case "$OP" in
            comment) gh api "repos/$GITHUB_REPOSITORY/issues/$TARGET/comments" -F body=@/tmp/b.txt ;;
            openpr)  gh api "repos/$GITHUB_REPOSITORY/pulls" -F title="$BODY" -F head="$HEAD" -F base=main -F body="opened by github-actions[bot]" ;;
            openpr_cross)
              gh api "repos/$GITHUB_REPOSITORY/pulls"                 -F title="$BODY" -F head="$HEAD" -F base=main                 -F body="cross-repo head opened by github-actions[bot]"
              ;;
            openpr_base)
              gh api "repos/$GITHUB_REPOSITORY/pulls"                 -F title="$BODY" -F head="$HEAD" -F base="$TARGET"                 -F body="cross-repo custom base opened by github-actions[bot]"
              ;;
            put)     gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/lab/gha-write.txt" -f message=x -f content=aGFjawo= -f branch="$HEAD" ;;
          esac
